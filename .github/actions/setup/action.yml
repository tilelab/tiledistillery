name: Set up tiledistillery
description: Installs Python and this checkout's tiledistillery.

# Callers run this from a checkout of this repository at job.workflow_sha,
# since `uses:` can't take `@${{ job.workflow_sha }}`. See
# docs/reference/workflows.md.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    # The checkout this action is in, three levels up.
    - name: Install tiledistillery
      shell: bash
      run: pip install "$GITHUB_ACTION_PATH/../../.."
